<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine Proposal</title>

<style>
    body {
        margin: 0;
        font-family: "Arial Rounded MT Bold", Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffdde1);
        position: relative;
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        font-size: 24px;
        opacity: 0.15;
        animation: float 10s linear infinite;
    }

    @keyframes float {
        from { transform: translateY(100vh) rotate(0deg); }
        to { transform: translateY(-10vh) rotate(360deg); }
    }

    /* Card */
    .card {
        position: relative;
        z-index: 10;
        width: 90%;
        max-width: 500px;
        padding: 30px;
        text-align: center;
        background: rgba(255,255,255,0.25);
        border: 2px solid white;
        border-radius: 25px;
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
        margin-bottom: 15px;
    }

    img {
        width: 50%;
        border-radius: 15px;
        margin-bottom: 15px;
    }

    #message {
        min-height: 50px;
        margin-bottom: 20px;
        font-size: 16px;
    }

    .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    button {
        flex: 1;
        padding: 12px;
        font-size: 18px;
        border-radius: 15px;
        border: 2px solid white;
        background-color: #ff6b81;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s;
    }

    button:hover {
        transform: scale(1.05);
    }

    #finalPage {
        position: absolute;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex-direction: column;
        color: white;
        animation: fadeIn 1.5s ease forwards;
        font-size: 24px;
        z-index: 20;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<!-- Floating hearts -->
<script>
for (let i = 0; i < 25; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";
    heart.style.fontSize = (16 + Math.random() * 24) + "px";
    document.body.appendChild(heart);
}
</script>

<div class="card" id="card">
    <h1>Will you be my Valentine?</h1>
    <!-- CHANGE IMAGE FILE NAME HERE -->
    <img src="images/CatL.png" alt="Us" />
    <div id="message"></div>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<div id="finalPage">
    <h1>YAYYYYY ❤️</h1>
    <p>I love you so much and I can't wait to celebrate together!!</p>
</div>



<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const card = document.getElementById("card");
const finalPage = document.getElementById("finalPage");

let noClicks = 0;

function moveNoButton() {
    const cardRect = card.getBoundingClientRect();
    let x, y;

    do {
        x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    } while (
        x > cardRect.left &&
        x < cardRect.right &&
        y > cardRect.top &&
        y < cardRect.bottom
    );

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("click", () => {
    noClicks++;

    if (noClicks === 1) {
        message.innerText = "It looks like you accidentally clicked No so I moved it out of the way... let's try this again, will you be my valentine?";
        moveNoButton();
    } else if (noClicks === 2) {
        message.innerText = "Finger slipped again? 😂 Happens to the best of us... so we valentining or what?";
        noBtn.style.display = "none";
    }
});

yesBtn.addEventListener("click", () => {
    card.style.display = "none";
    finalPage.style.display = "flex";
});
</script>

</body>
</html>
